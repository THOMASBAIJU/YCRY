{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto min-h-[80vh] flex items-center justify-center py-10">
    <div class="w-full max-w-md bg-white/60 backdrop-blur-xl rounded-[2.5rem] shadow-2xl p-8 md:p-12 border border-white/50" data-aos="fade-up">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-display font-extrabold text-warm-dark mb-2">Reset Password 🔒</h1>
            <p class="text-warm-gray">Enter your new password below.</p>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label for="password" class="label-premium">New Password</label>
                <input type="password" name="password" id="password" class="input-premium" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="w-full btn-primary bg-warm-coral hover:bg-red-400 border-none text-white py-4 text-xl shadow-lg hover:shadow-warm-coral/50 transition-all rounded-2xl flex items-center justify-center gap-2">
                Update Password
            </button>
        </form>

    </div>
</div>
{% endblock %}
